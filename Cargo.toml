[workspace]
resolver = "3"
members = ["crates/cli", "crates/core", "crates/nvim"]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
license = "MIT"

[workspace.dependencies]
time = { version = "0.3.47", features = ["formatting"] }
tracing = "0.1.41"
tracing-appender = "0.2.3"
tracing-subscriber = { version = "0.3.20", features = ["fmt"] }
