name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            target: aarch64-apple-darwin
            library: libvestigia_nvim.dylib
            archive: vestigia-nvim-aarch64-apple-darwin.tar.gz

          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            library: libvestigia_nvim.so
            archive: vestigia-nvim-x86_64-unknown-linux-gnu.tar.gz

          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            library: libvestigia_nvim.so
            archive: vestigia-nvim-aarch64-unknown-linux-gnu.tar.gz

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Verify Rust toolchain
        run: |
          rustc --version
          cargo --version

      - name: Build native plugin
        run: cargo build --release -p vestigia-nvim --target ${{ matrix.target }}

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.library }}" "dist/${{ matrix.library }}"

      - name: Inspect macOS dependencies
        if: runner.os == 'macOS'
        run: |
          otool -D "dist/${{ matrix.library }}"
          otool -L "dist/${{ matrix.library }}"

      - name: Inspect Linux dependencies
        if: runner.os == 'Linux'
        run: ldd "dist/${{ matrix.library }}"

      - name: Package artifact
        run: tar -czf "dist/${{ matrix.archive }}" -C dist "${{ matrix.library }}"

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.archive }}
          path: dist/${{ matrix.archive }}

  release:
    name: publish release
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: dist/*.tar.gz
